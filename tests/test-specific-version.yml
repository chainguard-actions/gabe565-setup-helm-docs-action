name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gh CLI if missing
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update -qq
            apt-get install -y -qq gh
          fi
          gh --version
      - id: action
        uses: .
        with:
          version: v1.14.2
      - name: Assert version output matches requested version
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          if [ "$VERSION" != "v1.14.2" ]; then
            echo "FAIL: expected version 'v1.14.2' but got '$VERSION'"
            exit 1
          fi
          echo "PASS: version matches 'v1.14.2'"
      - name: Assert helm-docs is on PATH
        run: |
          if ! command -v helm-docs >/dev/null 2>&1; then
            echo "FAIL: helm-docs not found on PATH"
            exit 1
          fi
          echo "PASS: helm-docs found at $(command -v helm-docs)"
      - name: Assert helm-docs version matches installed version
        run: |
          ACTUAL="$(helm-docs --version 2>&1)"
          echo "helm-docs --version output: $ACTUAL"
          if echo "$ACTUAL" | grep -q "1.14.2"; then
            echo "PASS: version string contains '1.14.2'"
          else
            echo "FAIL: expected version string to contain '1.14.2', got: $ACTUAL"
            exit 1
          fi
